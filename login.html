<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Ans2Quest 로그인">
<title>로그인 — Ans2Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/theme.js"></script>
<style>
/* 이 페이지 전용. 공용 토큰/버튼/네비는 styles.css 에 있다 */

/* 로그인은 이탈을 만들면 안 되는 화면이라 상단 메뉴를 브랜드만 남긴다 */
.auth-bar { height: 56px; display: flex; align-items: center; }
.auth-bar .nav-inner { justify-content: flex-start; }

.auth {
  position: relative;
  min-height: calc(100vh - 56px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  overflow: hidden;
}
.auth canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.auth-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  padding: 40px;
  border: 1px solid var(--hairline);
  border-radius: var(--rounded-lg);
  /* 반투명 + 블러 — 뒤의 구가 비쳐서 첫 화면과 이어진다 */
  background: var(--glass);
  backdrop-filter: blur(12px);
  box-shadow: var(--glass-shadow);
}

.auth-card h1 {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.3px;
  word-break: keep-all;
  color: var(--ink);
  margin-bottom: var(--sp-xs);
}
.auth-lead { font-size: 15px; color: var(--muted); word-break: keep-all; margin-bottom: var(--sp-xl); }

/* 폼 전체에 대한 결과 알림 (서버 응답, 연결 실패 등) */
.auth-notice {
  display: none;
  margin-bottom: var(--sp-md);
  padding: 12px 14px;
  border-radius: var(--rounded-md);
  font-size: 13.5px;
  line-height: 1.5;
  word-break: keep-all;
  border: 1px solid var(--error);
  background: var(--error-soft);
  color: var(--error);
}
.auth-notice.show { display: block; }

/* 구글 로그인 성공 결과 표시 — 성공은 error 톤이 아니라 muted 톤으로 */
.auth-result {
  display: none;
  margin-bottom: var(--sp-md);
  padding: 12px 14px;
  border-radius: var(--rounded-md);
  font-size: 13.5px;
  line-height: 1.5;
  word-break: keep-all;
  border: 1px solid var(--hairline);
  background: var(--surface-soft);
  color: var(--body);
}
.auth-result.show { display: block; }

/* 소셜 로그인 버튼.
   공통 골격은 design-system.md 의 button 규격(14px / 500 / lineHeight 1)과
   rounded-lg(12px)를 따른다. 12px 는 카카오 필수 규격과도 일치한다.
   구글 가이드가 "다른 소셜 옵션과 최소한 동등하게 노출"을 요구하므로
   네 개의 크기·너비·간격을 모두 동일하게 맞춘다. */
.providers { display: flex; flex-direction: column; gap: var(--sp-xs); }

.btn-oauth {
  width: 100%;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: none;
  border-radius: var(--rounded-lg);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  line-height: 1;
  transition: filter .15s;
}
.btn-oauth:hover { filter: brightness(.96); }
.btn-oauth[disabled] { opacity: .6; cursor: progress; }
.btn-oauth svg { width: 18px; height: 18px; flex-shrink: 0; }

/* 각 사의 브랜드 규격. 색을 임의로 바꾸면 심사에서 반려될 수 있다. */
.oauth-kakao   { background: #FEE500; color: rgba(0, 0, 0, .85); }
.oauth-google  { background: #FFFFFF; color: #1f1f1f; border: 1px solid #747775; }
.oauth-github  { background: #24292f; color: #ffffff; }
.oauth-discord { background: #5865F2; color: #ffffff; }

.auth-hint {
  margin-top: var(--sp-md);
  text-align: center;
  font-size: 13px;
  color: var(--muted);   /* --muted-soft 는 13px 에서 3.23:1 로 AA 미달 */
  word-break: keep-all;
}

@media (max-width: 480px) {
  .auth { padding: 24px 16px; }
  .auth-card { padding: 28px 22px; }
  .auth-card h1 { font-size: 27px; }
}
</style>
</head>
<body>

<header class="top-nav auth-bar">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M10 3h6v7.5l5.5 11H4.5l5.5-11V3z" stroke="#167a63" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
        <line x1="9" y1="3" x2="17" y2="3" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="11.5" cy="17" r="1.2" fill="#d97706" opacity="0.9"/>
        <circle cx="15" cy="19" r="0.9" fill="#167a63" opacity="0.8"/>
      </svg>
      Ans2Quest
    </a>
  </div>
</header>

<main class="auth">
  <canvas data-sphere data-count="700" data-alpha="0.45" data-clear="0.6" aria-hidden="true"></canvas>

  <div class="auth-card">
    <h1>탐구를 시작해볼까요?</h1>
    <p class="auth-lead">이미 쓰던 계정으로 로그인하세요. 처음이라면 로그인 후 약관 동의만 하면 바로 시작할 수 있습니다.</p>

    <p class="auth-notice" id="notice" role="alert"></p>

    <div class="providers">
      <button type="button" class="btn-oauth oauth-kakao" data-provider="kakao">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#000000" d="M12 3C6.99 3 3 6.24 3 10.2c0 2.52 1.68 4.74 4.2 6.02-.18.66-.66 2.4-.75 2.78-.12.48.18.48.36.36.15-.09 2.34-1.59 3.3-2.25.6.09 1.23.15 1.89.15 5.01 0 9-3.24 9-7.06S17.01 3 12 3z"/>
        </svg>
        카카오 로그인
      </button>

      <!-- 구글: G 로고는 컬러 그라데이션 원본만 사용 가능하고 크기·색 변경이 금지된다.
           모노크롬 대체나 로고 단독 표기도 불가라 문구를 반드시 함께 둔다. -->
      <button type="button" class="btn-oauth oauth-google" data-provider="google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google로 로그인
      </button>

      <button type="button" class="btn-oauth oauth-github" data-provider="github">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#ffffff" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub로 로그인
      </button>

      <button type="button" class="btn-oauth oauth-discord" data-provider="discord">
        <svg viewBox="0 0 71 55" aria-hidden="true">
          <path fill="#ffffff" d="M60.1 4.9A58.5 58.5 0 0 0 45.65.42a.22.22 0 0 0-.23.1c-.63 1.11-1.32 2.56-1.8 3.7a54 54 0 0 0-16.23 0A37.4 37.4 0 0 0 25.56.52a.23.23 0 0 0-.23-.1A58.4 58.4 0 0 0 10.88 4.9a.21.21 0 0 0-.1.08C1.58 18.73-.94 32.14.29 45.39c0 .07.04.13.09.17a58.8 58.8 0 0 0 17.73 8.96c.09.03.19 0 .24-.08a42 42 0 0 0 3.63-5.9.22.22 0 0 0-.12-.31 38.7 38.7 0 0 1-5.54-2.64.22.22 0 0 1-.02-.37c.37-.28.74-.57 1.1-.86a.21.21 0 0 1 .22-.03c11.62 5.3 24.2 5.3 35.68 0a.21.21 0 0 1 .23.03c.36.29.73.58 1.1.86a.22.22 0 0 1-.02.37 36.3 36.3 0 0 1-5.54 2.63.22.22 0 0 0-.12.32 47.2 47.2 0 0 0 3.63 5.9c.05.08.15.11.24.08a58.6 58.6 0 0 0 17.76-8.96.22.22 0 0 0 .09-.17c1.48-15.32-2.48-28.62-10.5-40.41a.17.17 0 0 0-.09-.09zM23.73 37.33c-3.5 0-6.38-3.21-6.38-7.16s2.83-7.16 6.38-7.16c3.58 0 6.44 3.24 6.38 7.16 0 3.95-2.83 7.16-6.38 7.16zm23.59 0c-3.5 0-6.38-3.21-6.38-7.16s2.83-7.16 6.38-7.16c3.58 0 6.44 3.24 6.38 7.16 0 3.95-2.8 7.16-6.38 7.16z"/>
        </svg>
        Discord로 로그인
      </button>
    </div>

    <!-- 약관 동의는 여기서 받지 않는다. 로그인은 순수 로그인이고, 신규
         가입자는 서버가 /welcome 으로 보내 거기서 동의를 받는다.
         기존 사용자를 매번 동의 화면 앞에 세울 이유가 없다. -->
    <p class="auth-result" id="result"></p>
  </div>
</main>

<script src="/assets/js/session.js"></script>
<script src="/assets/js/sphere.js"></script>
<script>
(function () {
  // 로그인은 이제 서버가 주도한다. 브라우저는 링크만 따라가면 된다:
  //   /api/auth/{provider}/start  →  제공자 동의 화면  →  /api/auth/{provider}/callback
  // client_id 와 state 를 프론트에 두지 않는 이유:
  //   - state 를 sessionStorage 에 두면 서버가 대조할 수 없어 CSRF 방어가 성립하지 않는다
  //   - 이제 서버가 state 를 발급해 httpOnly 쿠키에 심고, 콜백에서 직접 대조한다
  const notice = document.getElementById('notice');
  const LABEL = { kakao: '카카오', google: 'Google', github: 'GitHub', discord: 'Discord' };

  // 콜백이 실패하면 ?error= 를 달고 돌아온다
  const ERRORS = {
    cancelled: '로그인이 취소되었습니다.',
    bad_state: '보안 검증에 실패했습니다. 다시 시도해 주세요.',
    no_code: '제공자로부터 인가 코드를 받지 못했습니다.',
    exchange_failed: '로그인 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.'
  };
  const err = new URLSearchParams(location.search).get('error');
  if (err) {
    notice.textContent = ERRORS[err] || '로그인에 실패했습니다.';
    notice.classList.add('show');
    history.replaceState(null, '', location.pathname);   // 새로고침 시 반복 표시 방지
  }

  // 약관 동의는 이 화면의 일이 아니다. 신규 가입자는 서버가 /welcome 으로
  // 보내 거기서 받는다 — auth.js 콜백의 termsAcceptedAt 판정이 그 강제다.
  document.querySelectorAll('.btn-oauth[data-provider]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const name = btn.dataset.provider;
      btn.disabled = true;
      /* 로그인 페이지 자신으로 돌아오면 곤란하다. ?to= 로 받은 곳이 있으면
         그리로, 없으면 메인으로 보낸다. */
      var back = new URLSearchParams(location.search).get('to') || '/';
      Session.startLogin(name, back);

      // 서버가 아직 배포되지 않았거나 자격증명이 없으면 이동이 안 된다.
      // 버튼이 영영 잠긴 채로 남지 않도록 되살린다.
      setTimeout(function () {
        if (!btn.disabled) return;
        btn.disabled = false;
        notice.textContent = LABEL[name] + ' 로그인 서버에 연결하지 못했습니다. 배포 후 다시 시도해 주세요.';
        notice.classList.add('show');
      }, 4000);
    });
  });

  // 이미 로그인 상태면 로그인 화면에 머물 이유가 없다
  Session.refresh().then(function (user) {
    if (user) window.location.replace('/');
  });
})();
</script>

</body>
</html>
