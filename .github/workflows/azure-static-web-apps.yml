name: Azure Static Web Apps 배포

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# 기본 권한을 최소로 — PR 코멘트에 필요한 것만 연다
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: API 테스트
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix api || npm install --prefix api
      # 세션 서명이 뚫리면 인증 전체가 무너진다 — 배포 전에 반드시 통과해야 한다
      - name: 세션 보안 테스트
        run: node --test src/lib/session.test.js
        working-directory: api

  build_and_deploy:
    name: 빌드 및 배포
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Static Web Apps 배포
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"        # 정적 파일 루트 (Index.html 이 있는 곳)
          api_location: "api"      # Azure Functions
          output_location: ""      # 빌드 단계가 없는 정적 사이트

  close_pr:
    name: PR 프리뷰 정리
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: 프리뷰 환경 삭제
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
