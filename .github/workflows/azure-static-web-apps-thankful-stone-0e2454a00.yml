name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # 커밋 없이 다시 배포해야 할 때 (환경 변수만 바꿨을 때 등).
  # Actions 탭 → 이 워크플로 → "Run workflow" 버튼.
  workflow_dispatch:

jobs:
  test:
    name: API 테스트
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Azure Functions 가 실제로 쓰는 버전과 맞춘다 (배포 로그의
          # FUNCTION_LANGUAGE_VERSION: 22). 다른 버전에서 테스트하면
          # 통과해도 프로덕션에서 다르게 동작할 수 있다.
          node-version: 22
      - run: npm ci --prefix api || npm install --prefix api
      # 세션 서명이 뚫리면 인증 전체가 무너진다 — 배포 전에 반드시 통과해야 한다
      - name: 인증 보안 테스트
        run: node --test
        working-directory: api

  build_and_deploy_job:
    needs: test
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # v3 는 Node 20 런타임이라 GitHub 이 지원 종료 경고를 띄운다 (Azure 자동 생성분)
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_STONE_0E2454A00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          # 이 프로젝트의 화면은 별도 빌드가 필요 없는 HTML/CSS/JS 파일이다.
          # 지정하지 않으면 Azure가 npm run build를 찾다가 배포가 실패한다.
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_STONE_0E2454A00 }}
          action: "close"
