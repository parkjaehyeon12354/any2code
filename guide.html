<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ans2Quest 탐구 가이드">
  <title>가이드 — Ans2Quest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    .guide-hero {
      position: relative;
      min-height: 390px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #f5fbf8 0%, #f7f4ec 100%);
    }

    .guide-hero::before,
    .guide-hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .guide-hero::before {
      width: 260px;
      height: 260px;
      right: 9%;
      top: -70px;
      background: #dcefe7;
    }

    .guide-hero::after {
      width: 150px;
      height: 150px;
      right: 3%;
      bottom: -65px;
      background: #e7dcbf;
      opacity: 0.75;
    }

    .guide-hero .container {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .guide-hero h1 {
      max-width: 720px;
      margin: 0 0 16px;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(34px, 4vw, 52px);
      line-height: 1.2;
      letter-spacing: -0.03em;
      word-break: keep-all;
    }

    .guide-hero p:not(.eyebrow) {
      max-width: 540px;
      margin: 0;
      color: var(--body);
      font-size: 17px;
      line-height: 1.7;
      word-break: keep-all;
    }

    .guide-content {
      min-height: 360px;
      padding: 64px 0;
    }

    @media (max-width: 700px) {
      .guide-hero {
        min-height: 330px;
      }

      .guide-hero::before {
        right: -100px;
      }

      .guide-hero p:not(.eyebrow) {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <header class="top-nav" id="top-nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">
        <svg viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M10 3h6v7.5l5.5 11H4.5l5.5-11V3z" stroke="#167a63" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
        <line x1="9" y1="3" x2="17" y2="3" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="11.5" cy="17" r="1.2" fill="#d97706" opacity="0.9"/>
        <circle cx="15" cy="19" r="0.9" fill="#167a63" opacity="0.8"/>
      </svg>
      Ans2Quest
    </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="#">물리학</a></li>
        <li><a href="#">화학</a></li>
        <li><a href="#">생명과학</a></li>
        <li><a href="#">지구과학</a></li>
        <li><a href="/community">커뮤니티</a></li>
        <li><a href="#">심화 탐구</a></li>
        <li class="active"><a href="/guide">가이드</a></li>
      </ul>

      <a href="/login" class="btn btn-primary">시작하기</a>
    </div>
  </header>

  <main>
    <section class="guide-hero">
      <div class="container">
        <p class="eyebrow">ANS2QUEST GUIDE</p>
        <h1>탐구를 시작하는 가장 좋은 방법</h1>
        <p>
          과학적 질문을 만들고, 실험을 설계하고, 생각을 기록하는
          Ans2Quest의 핵심 사용법을 한눈에 알아보세요.
        </p>
      </div>
    </section>

    <section class="guide-content">
      <div class="container">
        <!-- 여기에 원하는 가이드 내용을 추가하세요 -->
      </div>
    </section>
  </main>
</body>
</html>
